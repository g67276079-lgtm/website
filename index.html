}
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab-btn");
  if(b) switchView(b.dataset.view);
});

/* ==================== 搜索 ==================== */
const searchInput = $("#searchInput"), searchDrop = $("#searchDrop");
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim();
  if(!q){ searchDrop.classList.remove("show"); applyFilters(); return; }
  const hitsU = DATA.units.filter(u => u.name.includes(q));
  const hitsK = DATA.kps.filter(k => k.name.includes(q));
  const rows = [
    ...hitsU.slice(0, 4).map(u => ({t:"unit", id:u.id, name:u.name, sub:u.sem + " · 单元"})),
    ...hitsK.slice(0, 10).map(k => ({t:"kp", id:k.id, name:k.name, sub:UNIT[k.unit].name}))
  ];
  searchDrop.innerHTML = rows.length
    ? rows.map(r => `<div class="sd-item" data-t="${r.t}" data-id="${r.id}">${esc(r.name)}<span class="sd-t">${esc(r.sub)}</span></div>`).join("")
    : `<div class="sd-empty">未找到「${esc(q)}」相关知识点</div>`;
  searchDrop.classList.add("show");
  // 跨模块高亮：命中的保留，其余压暗
  const okU = new Set(hitsU.map(u => u.id)), okK = new Set(hitsK.map(k => k.id));
  const okUnits = new Set([...okU, ...hitsK.map(k => k.unit)]);
  document.querySelectorAll(".ucard").forEach(c => c.classList.toggle("search-dim", !okUnits.has(c.dataset.uid)));
  document.querySelectorAll(".kp-row").forEach(r => r.classList.toggle("search-dim", !okK.has(r.dataset.kid)));
  document.querySelectorAll(".hull-g").forEach(g2 => g2.classList.toggle("search-dim", !okUnits.has(g2.dataset.uid)));
  Object.keys(nodeEls).forEach(id => nodeEls[id].classList.toggle("search-dim", !okK.has(id)));
});
searchDrop.addEventListener("click", e => {
  const item = e.target.closest(".sd-item");
  if(!item) return;
  searchDrop.classList.remove("show");
  if(item.dataset.t === "unit") openPanel(item.dataset.id);
  else gotoNetwork(item.dataset.id);
});
document.addEventListener("click", e => {
  if(!e.target.closest(".search-wrap")) searchDrop.classList.remove("show");
});

/* ==================== 筛选 ==================== */
function kpMatches(el){
  const g = $("#fGrade").value, m = $("#fModule").value, f = $("#fFreq").value;
  if(g && el.dataset.grade !== g) return false;
  if(m && el.dataset.module !== m) return false;
  if(f && el.dataset.tier !== f) return false;
  return true;
}
function applyFilters(){
  searchInput.value.trim() || document.querySelectorAll(".search-dim").forEach(el => el.classList.remove("search-dim"));
  // 方格
  document.querySelectorAll(".ucard").forEach(c => c.classList.toggle("fhide", !kpMatches(c)));
  document.querySelectorAll("#gridBox .sem-row").forEach(row => {
    row.style.display = row.querySelectorAll(".ucard:not(.fhide)").length ? "" : "none";
  });
  // 清单
  document.querySelectorAll(".kp-row").forEach(r => r.classList.toggle("fhide", !kpMatches(r)));
  document.querySelectorAll(".unit-block").forEach(b => {
    b.style.display = b.querySelectorAll(".kp-row:not(.fhide)").length ? "" : "none";
  });
  document.querySelectorAll("#checkBox .sem-title").forEach(t => {
    let n = t.nextElementSibling, any = false;
    while(n && !n.classList.contains("sem-title")){ if(n.style.display !== "none") any = true; n = n.nextElementSibling; }
    t.style.display = any ? "" : "none";
  });
  // 网格节点 + 单元领地
  Object.values(nodeEls).forEach(g2 => g2.classList.toggle("n-dim", !kpMatches(g2)));
  document.querySelectorAll(".hull-g").forEach(h => h.classList.toggle("h-dim", !kpMatches(h)));
  edgeEls.forEach(ln => {
    const a = nodeEls[ln.dataset.s], b = nodeEls[ln.dataset.t];
    ln.classList.toggle("e-dim", (a && a.classList.contains("n-dim")) || (b && b.classList.contains("n-dim")));
  });
}
["#fGrade", "#fModule", "#fFreq"].forEach(s => $(s).addEventListener("change", applyFilters));

/* ==================== 导出 / 导入 / PNG ==================== */
$("#btnExport").addEventListener("click", async () => {
  const payload = {app:"dg-math-map", version:1, savedAt:new Date().toISOString(), states:STATES};
  const text = JSON.stringify(payload, null, 2);
  const fname = "东莞中考数学自检进度_" + new Date().toISOString().slice(0, 10) + ".json";
  // iPhone/iPad 优先走系统分享：可直接「存储到文件」App（PWA 与 Safari 互传也靠它）
  try{
    const file = new File([text], fname, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"自检进度备份"});
      toast("✓ 在分享面板选「存储到文件」即可保存备份");
      return;
    }
  }catch(e){
    if(e && e.name === "AbortError") return;   // 用户取消分享
  }
  const blob = new Blob([text], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  URL.revokeObjectURL(a.href);
  if(IS_IOS) toast("✓ 已导出：在预览页右上角「分享」→「存储到文件」");
  else toast("✓ 已导出 JSON 备份（含全部自检状态）");
});
$("#btnImport").addEventListener("click", () => $("#fileInput").click());
$("#fileInput").addEventListener("change", e => {
  const f = e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const obj = JSON.parse(rd.result);
      const src = obj && obj.states ? obj.states : obj;
      const next = {};
      for(const k in src){
        if(KIDS.includes(k) && ["s","m","w"].includes(src[k])) next[k] = src[k];
      }
      STATES = next;
      saveStates(); refreshAllKpRows(); updateStats();
      toast(`✓ 导入成功，已覆盖 ${Object.keys(next).length} 条自检记录`);
    }catch(err){ toast("✕ 导入失败：文件不是有效的进度 JSON"); }
  };
  rd.readAsText(f);
  e.target.value = "";
});
/* 空白清单 PNG（A4 宽 1240px，打印用） */
$("#btnPng").addEventListener("click", () => {
  const W = 1240, PAD = 56, CW = W - PAD * 2;
  const lineH = {sem:52, unit:46, kp:40};
  let H = 210;
  const sems = [...new Set(DATA.units.map(u => u.sem))];
  sems.forEach(sem => {
    H += lineH.sem;
    DATA.units.filter(u => u.sem === sem).forEach(u => { H += lineH.unit + u.kpIds.length * lineH.kp; });
  });
  H += 60;
  const cv = document.createElement("canvas");
  const scale = 2;
  cv.width = W * scale; cv.height = H * scale;
  const ctx = cv.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, H);
  const F = (px, bold, serif) => `${bold ? "700 " : ""}${px}px ${serif ? 'Georgia,"Songti SC",serif' : '"Hiragino Sans GB","Heiti SC","PingFang SC","Microsoft YaHei",sans-serif'}`;
  let y = PAD;
  ctx.fillStyle = "#6B4423"; ctx.font = F(34, true, true);
  ctx.fillText("东莞中考数学知识点自检清单", PAD, y + 12);
  y += 46;
  ctx.font = F(17, false); ctx.fillStyle = "#8B6914";
  ctx.fillText("生成日期：" + new Date().toLocaleDateString("zh-CN") + "　｜　对标人教版七~九年级 · 共 " + DATA.kps.length + " 个核心知识点", PAD, y + 8);
  y += 30;
  ctx.fillText("状态标记：☑ 熟练　◐ 模糊　✕ 未掌握（打印后在对应圆圈内打 √）", PAD, y + 8);
  y += 26;
  ctx.strokeStyle = "#D9D2C5"; ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
  y += 10;
  const optX = [W - PAD - 452, W - PAD - 336, W - PAD - 220, W - PAD - 104];
  const optLabel = ["未自检", "熟练", "模糊", "未掌握"];
  sems.forEach(sem => {
    y += 8;
    ctx.fillStyle = "#F37021"; ctx.fillRect(PAD, y + 8, 5, 24);
    ctx.fillStyle = "#6B4423"; ctx.font = F(24, true, true);
    ctx.fillText(sem, PAD + 14, y + 27);
    y += lineH.sem - 8;
    DATA.units.filter(u => u.sem === sem).forEach(u => {
      ctx.fillStyle = "#8B6914"; ctx.font = F(20, true);
      ctx.fillText("▸ " + u.name + "（" + u.module + "）", PAD + 6, y + 16);
      y += lineH.unit - 6;
      u.kpIds.forEach(id => {
        const k = KP[id];
        ctx.font = F(18, false); ctx.fillStyle = "#4A3420";
        let name = k.name + "  " + "★".repeat(k.stars);
        while(ctx.measureText(name).width > CW - 500 && name.length > 4) name = name.slice(0, -2);
        ctx.fillText(name, PAD + 22, y + 14);
        optX.forEach((ox, i) => {
          ctx.strokeStyle = "#A08B73"; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.arc(ox, y + 8, 8, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = "#8B6914"; ctx.font = F(16, false);
          ctx.fillText(optLabel[i], ox + 14, y + 13);
        });
        ctx.strokeStyle = "#EFE9DF"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(PAD + 18, y + 26); ctx.lineTo(W - PAD, y + 26); ctx.stroke();
        y += lineH.kp;
      });
    });
  });
  ctx.fillStyle = "#B09B7F"; ctx.font = F(15, false);
  ctx.fillText("考频为基于近5年东莞中考真题估算（非官方分值占比）；真题题号溯源待核验。", PAD, y + 34);
  const a = document.createElement("a");
  a.href = cv.toDataURL("image/png");
  a.download = "东莞中考数学自检清单_打印版.png";
  a.click();
  toast("✓ 已导出空白清单 PNG（宽度适配 A4 打印）");
});
